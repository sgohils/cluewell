name: Test Cluewell
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.cjs
      - run: node tools/standalone.cjs Cluewell.html
      - uses: actions/upload-artifact@v4
        with:
          name: Cluewell-standalone
          path: Cluewell.html
